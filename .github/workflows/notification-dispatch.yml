name: Dispatch notification emails

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch queued emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.DISTRICO_APP_URL || 'https://frontend-districo.vercel.app' }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            "${APP_URL%/}/api/internal/notifications/dispatch"
          printf '\n'
        shell: bash
